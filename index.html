function boldCardsForCurrentHeat(){
  const level=currentHeatLevel();
  if(level===1) return boldHeat1Cards;
  if(level===2) return boldHeat2Cards;
  if(level===3) return boldHeat3Cards;
  const extreme=boldExtremeCards.filter(x=>typeof x==='string'&&x.trim());
  return extreme.length ? extreme : boldHeat3Cards;
}
function boldHeatName(){
  const level=currentHeatLevel();
  if(level===1) return 'פלירט';
  if(level===2) return 'נשיקות ומגע';
  if(level===3) return 'נועז';
  return boldExtremeCards.some(x=>typeof x==='string'&&x.trim()) ? 'אקסטרים' : 'נועז';
}
function showTruthCard(title='אמת'){
  // אמת = שאלות. משתמש באותו מאגר של "כלום", כך שאין חזרות בין אמת לכלום.
  showUniqueCard(title,'nothing',nothingCards,'nothing');
}
function showDareCard(title='חובה'){
  // חובה = משימות. משתמש במאגר "הכל" לפי רמת החום הנוכחית.
  const source=allCardsForCurrentHeat();
  let card=drawUnique('all',source);

  if(card===null){
    const fallback=allCards.filter(x=>typeof x==='string'&&x.trim());
    card=drawUnique('all',fallback);
    if(card===null){
      showInfo(title,'כל המשימות הזמינות כבר הופיעו במשחק הנוכחי.');
      return;
    }
    showCard(`${title} · ${heatName()}`,card,'all','all',fallback);
    return;
  }

  showCard(`${title} · ${heatName()}`,card,'all','all',source);
}

function setMode(mode){
  if(!['straight','gay','bi'].includes(mode)) return;
  gameMode=mode;

  const ids={
    straight:'modeStraight',
    gay:'modeGay',
    bi:'modeBi'
  };

  document.querySelectorAll('.seg').forEach(btn=>{
    btn.classList.remove('active');
    btn.setAttribute('aria-pressed','false');
  });

  const active=document.getElementById(ids[mode]);
  if(active){
    active.classList.add('active');
    active.setAttribute('aria-pressed','true');
  }
}
function fitGameToViewport(){
  const game=document.getElementById('screenGame');
  const board=document.getElementById('board');
  if(!game||!board||game.classList.contains('hidden')) return;

  const vw=window.innerWidth;
  const vh=window.innerHeight;
  const sideLayout=(vw>=640 && vw>vh);
  let size;

  if(sideLayout){
    const sideMin=Math.min(390,Math.max(260,Math.round(vw*0.34)));
    size=Math.min(vh-8,vw-sideMin-20);
  }else{
    const top=game.querySelector('.topbar');
    const playersBar=document.getElementById('playerStrip');
    const action=document.body.classList.contains('modal-open') ? document.getElementById('modalHost') : game.querySelector('.controls');
    const topH=top ? top.getBoundingClientRect().height : 44;
    const playersH=playersBar ? playersBar.getBoundingClientRect().height : 40;
    const actionH=action ? action.getBoundingClientRect().height : 118;
    const availableH=vh-8-topH-playersH-actionH-16;
    const availableW=vw-8;
    size=Math.min(availableW,availableH);
  }

  size=Math.max(190,Math.floor(size));
  game.style.setProperty('--board-size',size+'px');
  requestAnimationFrame(fitBoardTypography);
  setTimeout(fitBoardTypography,60);
}

function positions(){
  const ps=[];
  for(let c=0;c<15;c++) ps.push([14,c]);      // bottom row, 15 spaces כולל פינות
  for(let r=13;r>=0;r--) ps.push([r,14]);     // right side, 14 spaces עד הפינה העליונה
  for(let c=13;c>=0;c--) ps.push([0,c]);      // top row, 14 spaces עד הפינה השמאלית
  for(let r=1;r<=13;r++) ps.push([r,0]);      // left side, 13 spaces חזרה להתחלה-1
  return ps;                                   // total = 56
}

function buildBoard(){
  const g=document.getElementById('boardGrid');
  g.innerHTML='';
  const ps=positions();

  seq.forEach((s,i)=>{
    const rc=ps[i];
    const d=document.createElement('div');
    d.id='tile'+i;
    d.className='tile board-tile '+s.k;
    d.style.gridRow=(rc[0]+1);
    d.style.gridColumn=(rc[1]+1);

    const icon=document.createElement('div');
    icon.className='ico';
    icon.textContent=s.i||'';

    const label=document.createElement('div');
    label.className='lbl';
    label.textContent=s.t;

    const inner=document.createElement('div');
    inner.className='tile-inner';
    inner.appendChild(icon);
    inner.appendChild(label);
    d.appendChild(inner);
    g.appendChild(d);
  });

  renderPawns();
  requestAnimationFrame(renderPawns);
}

function renderPawns(){
  const layer=document.getElementById('markerLayer');
  if(!layer)return;
  layer.innerHTML='';
  const ps=positions();
  const grouped={};

  players.forEach((p,i)=>{
    if(!grouped[p.pos])grouped[p.pos]=[];
    grouped[p.pos].push({p,i});
  });

  Object.keys(grouped).forEach(k=>{
    const pos=Number(k);
    const rc=ps[pos];
    if(!rc)return;

    const cell=document.createElement('div');
    cell.className='marker-cell grid-marker';
    cell.style.gridRow=(rc[0]+1);
    cell.style.gridColumn=(rc[1]+1);

    grouped[pos].forEach(({p,i})=>{
      const dot=document.createElement('span');
      dot.className='player-dot'+(i===current?' current-dot':'');
      dot.title=p.name;
      dot.setAttribute('aria-label',p.name);
      dot.style.backgroundColor=p.color;
      dot.style.boxShadow=`0 0 0 1px rgba(0,0,0,.9),0 0 10px ${p.color},0 2px 4px rgba(0,0,0,.9)`;
      cell.appendChild(dot);
    });

    layer.appendChild(cell);
  });
}

let voiceEnabled=true,voiceQueue=[],voiceSpeaking=false,heVoice=null;
function loadHebrewVoice(){
  if(!('speechSynthesis' in window))return;
  let vs=window.speechSynthesis.getVoices();
  let heb=vs.filter(v=>/^he([-_]|$)/i.test(v.lang)||/Hebrew|עברית/i.test(v.name));
  heVoice=heb.find(v=>/Google|Samsung|Natural|Premium/i.test(v.name))||heb[0]||null;
}
if('speechSynthesis' in window){
  loadHebrewVoice();
  window.speechSynthesis.onvoiceschanged=loadHebrewVoice;
}else{
  voiceEnabled=false;
  window.addEventListener('load',()=>{
    const b=document.getElementById('voiceBtn');
    if(b)b.textContent='🔇 קול לא זמין ב־WebView';
  });
}
function cleanForSpeech(t){
  return String(t)
    .replace(/<[^>]+>/g,' ')
    .replace(/[🎲🛡️⛔❤️💋🎭🔄🍀👥👑]/g,' ')
    .replace(/נחת\/ה/g,'נחת')
    .replace(/זרק\/ה/g,'זרק')
    .replace(/מתחיל\/ה/g,'מתחיל')
    .replace(/מקבל\/ת/g,'מקבל')
    .replace(/מפסיד\/ה/g,'מפסיד')
    .replace(/דולג\/ה/g,'דולג')
    .replace(/\s+/g,' ').trim();
}
function speakHebrew(text,priority=false){
  if(!voiceEnabled||!('speechSynthesis' in window))return;
  let t=cleanForSpeech(text);
  if(!t)return;

  if(priority){
    voiceQueue=[];
    voiceSpeaking=false;
    window.speechSynthesis.cancel();
  }else{
    // Avoid long audio backlog: keep only the two newest queued announcements.
    if(voiceQueue.length>=2) voiceQueue=voiceQueue.slice(-1);
  }

  voiceQueue.push(t);
  processVoiceQueue();
}
function processVoiceQueue(){
  if(voiceSpeaking||!voiceQueue.length||!voiceEnabled)return;
  voiceSpeaking=true;
  let u=new SpeechSynthesisUtterance(voiceQueue.shift());
  u.lang='he-IL';
  u.rate=1.0;
  u.pitch=1;
  u.volume=1;
  if(heVoice)u.voice=heVoice;
  u.onend=u.onerror=()=>{
    voiceSpeaking=false;
    setTimeout(processVoiceQueue,25);
  };
  window.speechSynthesis.speak(u);
}
function toggleVoice(){
  voiceEnabled=!voiceEnabled;
  let b=document.getElementById('voiceBtn');
  if(b)b.textContent=voiceEnabled?'🔊 קול פעיל':'🔇 קול כבוי';
  if(!voiceEnabled&&'speechSynthesis' in window){
    voiceQueue=[];
    voiceSpeaking=false;
    window.speechSynthesis.cancel();
  }else if(voiceEnabled){
    speakHebrew('הקול פעיל',true);
  }
}

let currentCardDeckKey=null,currentCardSource=null,currentCardTitle=null,currentCardKind=null;
function replacementActorIndex(playerIndex=current){
  const r=taskReplacementFor[playerIndex];
  return (Number.isInteger(r)&&players[r]) ? r : playerIndex;
}
function consumeReplacementActor(playerIndex=current){
  const r=replacementActorIndex(playerIndex);
  if(r!==playerIndex) delete taskReplacementFor[playerIndex];
  return r;
}
function showCard(title,text,kind,deckKey=null,source=null){
  let p=players[current];

  // "החלפה" בגלגל: המשימה האישית הבאה של השחקן עוברת למחליף שנבחר.
  if((kind==='all'||kind==='bold') && replacementActorIndex(current)!==current){
    const original=players[current];
    const actorIndex=consumeReplacementActor(current);
    const actor=players[actorIndex];
    title=`${title} · החלפה`;
    text=`${actor.name} מחליף/ה את ${original.name} במשימה הזאת:\n${text}`;
    p=actor;
  }

  currentCardDeckKey=deckKey;
  currentCardSource=source;
  currentCardTitle=title;
  currentCardKind=kind;
  speakHebrew(`קלף ${title}. ${text}`);
  let useImm=(p.immunity>0&&deckKey&&source)?`<button class="secondary" onclick="useImmunity()">🛡 השתמש בחסינות וקבל קלף אחר</button>`:'';
  modal(`<h3>${title}</h3><p>${esc(text).replace(/\n/g,'<br>')}</p><div class="choices">${useImm}<button class="primary" onclick="closeModal();endAction()">בוצע / המשך</button></div>`);
}
function useImmunity(){

    showInfo(currentCardTitle,'אין קלף חדש נוסף בקטגוריה הזאת במשחק הנוכחי.');

function choosePlayerModal(title,text,action){
  pendingChoiceAction=action;
  speakHebrew(`${title}. ${text}`);

  const pairAction=(action==='pair'||action==='wheelPair'||action==='luckPair'||action==='wheelBold'||action==='wheelChoose');
  const taskPartnerAction=(action==='pair'||action==='wheelPair'||action==='luckPair'||action==='wheelBold');
  const baseIndex=taskPartnerAction ? replacementActorIndex(current) : current;
  const allowed=pairAction
    ? eligibleOthers(baseIndex)
    : players.map((p,i)=>i).filter(i=>i!==current);

  if(!allowed.length){
    pendingChoiceAction=null;
    const msg=gameMode==='straight'
      ? 'אין כרגע משתתף מהמין השני שאפשר לבחור.'
      : gameMode==='gay'
        ? 'אין כרגע משתתף מתאים מאותו המין שאפשר לבחור.'
        : 'אין כרגע משתתף נוסף שאפשר לבחור.';
    showInfo(title,msg);
    return;
  }

  const choices=allowed.map(i=>
    `<button class="choice" onclick="pickPlayer(${i})">${esc(players[i].name)}</button>`
  ).join('');

  modal(`<h3>${title}</h3><p>${text}</p><div class="choices">${choices}</div>`);
}
function pickPlayer(i){
  let action=pendingChoiceAction;
  pendingChoiceAction=null;
  closeModal();

  if(action==='pair'){
    const original=players[current];
    const actorIndex=consumeReplacementActor(current);
    let actor=players[actorIndex],partner=players[i],source=pairCardsForCurrentHeat(),task=drawUnique('pair',source);
    if(task===null){
      showInfo('משימה זוגית',`כל המשימות הזוגיות הזמינות ברמת ${pairHeatName()} כבר הופיעו במשחק הנוכחי.`);
      return;
    }
    const replacementNote=actorIndex!==current ? `${actor.name} מחליף/ה את ${original.name}.\n` : '';
    log(`${actor.name} ו-${partner.name} קיבלו משימה זוגית.`);
    setTimeout(()=>showCard(`משימה זוגית · ${pairHeatName()}`,`${replacementNote}${actor.name} ו-${partner.name}:\n${task}`,'pair','pair',source),60);
    return;
  }

  if(action==='swap'){
    let p=players[current],q=players[i],tmp=p.pos;
    p.pos=q.pos;q.pos=tmp;
    updateUI();
    log(`${p.name} ו-${q.name} החליפו מקומות.`);
    setTimeout(()=>showInfo('החלפת מקום',`הפיונים של ${p.name} ושל ${q.name} החליפו מקומות. המשבצות החדשות אינן מופעלות מחדש.`),60);
    return;
  }

  if(action==='wheelPair'){
    const original=players[current];
    const actorIndex=consumeReplacementActor(current);
    let actor=players[actorIndex],partner=players[i],source=pairCardsForCurrentHeat(),task=drawUnique('pair',source);
    if(task===null){
      showInfo('משימה זוגית',`כל המשימות הזוגיות הזמינות ברמת ${pairHeatName()} כבר הופיעו במשחק הנוכחי.`);
      return;
    }
    const replacementNote=actorIndex!==current ? `${actor.name} מחליף/ה את ${original.name}.\n` : '';
    log(`${actor.name} ו-${partner.name} קיבלו משימה זוגית.`);
    setTimeout(()=>showCard(`משימה זוגית · ${pairHeatName()}`,`${replacementNote}${actor.name} ו-${partner.name}:\n${task}`,'pair','pair',source),60);
    return;
  }

  if(action==='wheelBold'){
    const original=players[current];
    const actorIndex=consumeReplacementActor(current);
    let actor=players[actorIndex],partner=players[i],source=boldCardsForCurrentHeat(),task=drawUnique('bold',source);
    if(task===null){
      const allWritten=boldCards.filter(x=>typeof x==='string'&&x.trim());
      task=drawUnique('bold',allWritten);
      source=allWritten;
    }
    if(task===null){
      showInfo('משימה נועזת','כל המשימות הנועזות הזמינות כבר הופיעו במשחק הנוכחי.');
      return;
    }
    const replacementNote=actorIndex!==current ? `${actor.name} מחליף/ה את ${original.name}.\n` : '';
    log(`${actor.name} ו-${partner.name} קיבלו משימה נועזת.`);
    setTimeout(()=>showCard(`משימה נועזת · ${boldHeatName()}`,`${replacementNote}${actor.name} ו-${partner.name}:\n${task}`,'pair','bold',source),60);
    return;
  }

  if(action==='wheelReplace'){
    let actor=players[current],partner=players[i];
    taskReplacementFor[current]=i;
    log(`${actor.name} בחר את ${partner.name} להחלפה.`);

    return;
  }

  if(action==='wheelChoose'){

      setTimeout(()=>showCard(`בחירת שחקן — חובה · ${heatName()}`,`${chosen.name} מבצע/ת:\n${d}`,'choice',null,null),60);

      chosen.loseNext=true;

      return;
    }

    if(outcome==='decide'){
      speakHebrew(`${chosen.name} בוחר בשביל ${players[current].name}. הכל או כלום.`);
      setTimeout(()=>modal(`<h3>בחירת שחקן — החלטה</h3><p>${esc(chosen.name)} בוחר/ת בשביל ${esc(players[current].name)}: הכל או כלום?</p><div class="choices"><button class="choice" onclick="closeModal();showHeatAllCard()">הכל</button><button class="choice" onclick="closeModal();showUniqueCard('כלום','nothing',nothingCards,'nothing')">כלום</button></div>`),60);
      return;
    }
  }

  if(action==='luckPair'){
    const original=players[current];
    const actorIndex=consumeReplacementActor(current);
    let actor=players[actorIndex],partner=players[i],source=pairCardsForCurrentHeat(),task=drawUnique('pair',source);
    if(task===null){
      showInfo('מזל — משימה זוגית',`כל המשימות הזוגיות הזמינות ברמת ${pairHeatName()} כבר הופיעו במשחק הנוכחי.`);
      return;
    }
    const replacementNote=actorIndex!==current ? `${actor.name} מחליף/ה את ${original.name}.\n` : '';
    log(`${actor.name} ו-${partner.name} קיבלו בונוס זוגי.`);
    setTimeout(()=>showCard(`מזל — זוג · ${pairHeatName()}`,`${replacementNote}${actor.name} ו-${partner.name}:\n${task}`,'pair','pair',source),60);
    return;
  }

  if(action==='luckSkip'){
    players[i].loseNext=true;
    updateUI();
    setTimeout(()=>showInfo('מזל — בחירה',`${players[i].name} יפסיד/תפסיד את התור הבא.`),60);
    return;
  }

  if(action==='luckGiveImmunity'){
    players[i].immunity++;
    updateUI();

    return;
  }

  if(action==='luckStealImmunity'){
    if(players[i].immunity>0){
      players[i].immunity--;
      players[current].immunity++;
      updateUI();
      setTimeout(()=>showInfo('מזל — גניבת חסינות',`לקחת חסינות אחת מ-${players[i].name}.`),60);
    }else{
      players[current].immunity++;
      updateUI();
      setTimeout(()=>showInfo('מזל — אין מה לגנוב',`${players[i].name} בלי חסינות, אז קיבלת חסינות אחת במקום.`),60);
    }
    return;
  }

  if(action==='luckBack2'){
    players[i].pos=(players[i].pos-2+seq.length)%seq.length;
    updateUI();
    setTimeout(()=>showInfo('מזל — אחורה',`${players[i].name} זז/ה 2 משבצות אחורה. המשבצת החדשה לא מופעלת.`),60);

  }

  if(action==='luckForward3'){
    players[i].pos=(players[i].pos+3)%seq.length;

    setTimeout(()=>showInfo('מזל — קדימה',`${players[i].name} זז/ה 3 משבצות קדימה. המשבצת החדשה לא מופעלת.`),60);
    return;
  }

  if(action==='luckSwap'){
    let p=players[current],q=players[i],tmp=p.pos;

    updateUI();
    setTimeout(()=>showInfo('מזל — החלפת מקום',`${p.name} ו-${q.name} החליפו מקומות. המשבצות החדשות לא מופעלות.`),60);

  }
}

function spinWheel(){
  const segmentCount=WHEEL_CATS.length;
  const idx=Math.floor(Math.random()*segmentCount);
  const seg=360/segmentCount;
  const desired=((360-(idx*seg))%360+360)%360;
  const currentMod=((wheelRotation%360)+360)%360;
  const delta=360*5+((desired-currentMod+360)%360);
  wheelRotation+=delta;
  const disc=document.getElementById('wheelDisc');
  if(disc) disc.style.transform=`rotate(${wheelRotation}deg)`;
  sound(520,.1);
  setTimeout(()=>{const c=WHEEL_CATS[idx];log(`הגלגל נעצר על ${c.t}.`);handleWheel(c)},2380);
}

const luckEvents=[
  'immune1','immune2','extra','forward3','forward5','back2','back3','spinAgain',
  'bonusAll','bonusNothing','bonusBold','truthDare','pairBonus','chooseSkip','giveImmunity',
  'stealImmunity','swap','chooseBack2','chooseForward3','allForward1','allBack1','allImmunity',
  'returnStart','nextAll','nextNothing','nextWheel','allOrNothing','doublePrize','safeBonus','wildCard'

const usedLuckEvents=new Set();

function drawLuckEvent(){
  let available=luckEvents.filter(x=>!usedLuckEvents.has(x));
  if(!available.length){
    usedLuckEvents.clear();
    available=[...luckEvents];
  }
  const e=rand(available);
  usedLuckEvents.add(e);
  return e;
}

  }
  p.pos=target;
  updateUI();
  log(`${p.name} עבר/ה ל-${title}.`);
  resolveTile(p.pos);
}

function eligibleOthers(i){let me=players[i];return players.map((p,idx)=>({p,idx})).filter(x=>x.idx!==i).filter(x=>gameMode==='bi'||(gameMode==='straight'?x.p.gender!==me.gender:x.p.gender===me.gender)).map(x=>x.idx)}
function otherRandom(i){let arr=players.map((_,x)=>x).filter(x=>x!==i);return rand(arr)}
const usedCardIndexes={};

function resetCardHistory(){
  Object.keys(usedCardIndexes).forEach(k=>delete usedCardIndexes[k]);
  if(typeof usedLuckEvents!=='undefined') usedLuckEvents.clear();
}

function drawUnique(deckKey, source){
  if(!usedCardIndexes[deckKey]) usedCardIndexes[deckKey]=new Set();
  const used=usedCardIndexes[deckKey];
  const available=source.filter(card=>typeof card==='string'&&card.trim()&&!used.has(card));

  // A card is never repeated during the same game.
  if(!available.length) return null;

  const card=available[Math.floor(Math.random()*available.length)];
  used.add(card);
  return card;
}

function roundNumber(){
  return players.length ? Math.floor(completedTurns/players.length)+1 : 1;
}
function currentHeatLevel(){
  const r=roundNumber();
  if(r<=2) return 1;
  if(r<=5) return 2;
  if(r<=8) return 3;
  return 4;
}
function heatName(level=currentHeatLevel()){
  return ['','חימום','מגע','נועז','אקסטרים'][level]||'חימום';
}
function allCardsForCurrentHeat(){
  const level=currentHeatLevel();
  let pool=[...allWarmupCards];
  if(level>=2) pool.push(...allTouchCards);
  if(level>=3) pool.push(...allBoldHeatCards);
  if(level>=4) pool.push(...allExtremeCards.filter(x=>typeof x==='string'&&x.trim()));
  return pool;
}
function showHeatAllCard(){
  let source=allCardsForCurrentHeat();
  let card=drawUnique('all',source);

  if(card===null){
    source=allCards.filter(x=>typeof x==='string'&&x.trim());
    card=drawUnique('all',source);
  }
  if(card===null){
    showInfo('הכל','כל המשימות הזמינות כבר הופיעו במשחק הנוכחי.');
    return;
  }

  showCard(`הכל · ${heatName()}`,card,'all','all',source);
}

function showUniqueCard(title,deckKey,source,kind){
  const card=drawUnique(deckKey,source);
  if(card===null){
    showInfo(title,'כל הקלפים הייחודיים בקטגוריה הזאת כבר הופיעו במשחק הנוכחי.');
    return;
  }
  showCard(title,card,kind,deckKey,source);
}

function rand(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escJs(s){return String(s).replace(/['\\]/g,'\\$&')}



function fitTileTypography(){
  document.querySelectorAll('.tile').forEach(tile=>{
    const inner=tile.querySelector('.tile-inner');
    if(!inner) return;
    inner.style.transform='scale(1)';
    const aw=Math.max(1,tile.clientWidth-3), ah=Math.max(1,tile.clientHeight-3);
    const cw=Math.max(1,inner.scrollWidth), ch=Math.max(1,inner.scrollHeight);
    let s=Math.min(1,aw/cw,ah/ch);
    if(s<.995) s=Math.max(.72,s*.97);
    inner.style.transform='scale('+s.toFixed(3)+')';
  });
}
function fitWheelTypography(){
  const disc=document.getElementById('wheelDisc');
  if(!disc) return;
  disc.querySelectorAll('.wheel-label').forEach(box=>{
    const inner=box.querySelector('.wheel-label-inner');
    if(!inner) return;
    inner.style.transform='scale(1)';
    const aw=Math.max(1,box.clientWidth-2), ah=Math.max(1,box.clientHeight-2);
    const cw=Math.max(1,inner.scrollWidth), ch=Math.max(1,inner.scrollHeight);
    let s=Math.min(1,aw/cw,ah/ch);
    if(s<.995) s=Math.max(.68,s*.96);
    inner.style.transform='scale('+s.toFixed(3)+')';
  });
}
function fitBoardTypography(){fitTileTypography();fitWheelTypography();}

function wheelTextHtml(t){
  const map={
    'משימה נועזת':'משימה<br>נועזת',
    'אמת או חובה':'אמת<br>או חובה',
    'בחירת שחקן':'בחירת<br>שחקן',
    'הכל או כלום':'הכל<br>או כלום'
  };
  return map[t]||t;
}
function buildWheelVisual(){
  const disc=document.getElementById('wheelDisc'); if(!disc)return;
  disc.querySelectorAll('.wheel-label').forEach(x=>x.remove());
  const n=WHEEL_CATS.length, radius=29.3;
  WHEEL_CATS.forEach((c,i)=>{
    const a=i*(360/n), rad=(a-90)*Math.PI/180;
    const x=50+radius*Math.cos(rad), y=50+radius*Math.sin(rad);
    const el=document.createElement('div'); el.className='wheel-label';
    el.style.left=x+'%'; el.style.top=y+'%';
    // Pre-rotate each label with its own wedge. When that wedge reaches 12 o'clock,
    // the wheel's rotation cancels this angle and the landed text is upright.
    el.style.transform='translate(-50%,-50%) rotate('+a+'deg)';
    el.innerHTML='<span class="wheel-label-inner"><span class="wi">'+c.i+'</span><span class="wtxt">'+wheelTextHtml(c.t)+'</span></span>';
    disc.appendChild(el);
  });
  requestAnimationFrame(fitWheelTypography);
  setTimeout(fitWheelTypography,80);
}
const __buildBoard=buildBoard; buildBoard=function(){__buildBoard();buildWheelVisual();requestAnimationFrame(fitBoardTypography);setTimeout(fitBoardTypography,100);};
window.addEventListener('load',()=>{buildWheelVisual();setTimeout(fitBoardTypography,100);});
</script></body></html>
